name: Hardware Test (fork PRs)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: hardware-test-fork-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  find-pr:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.pr.outputs.number }}
      checkout-ref: ${{ steps.source.outputs.sha }}
    steps:
      # workflow_run does not list fork PRs, so look the PR up by its head commit.
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number" | head -n1)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
              -f state=pending \
              -f context='Hardware Test (fork PRs)' \
              -f description='Awaiting hardware-test approval - open Details' \
              -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
          fi

      - name: Link hardware-test approval in PR comment
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const sha = context.payload.workflow_run.head_sha;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: issue_number });
            if (pr.head.sha !== sha) return;
            const marker = '<!-- zswatch-fork-hardware-tests -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.reverse().find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.includes(marker));
            const previousRun = existing?.body.match(/actions\/runs\/(\d+)/);
            if (previousRun && Number(previousRun[1]) > Number(context.runId)) return;
            const body = [
              marker,
              '### Hardware tests',
              '',
              `**[Review and approve hardware tests](${runUrl})**`,
              '',
              'If approval is pending, choose **Review deployments**, select **external-pr-approval**, then **Approve and deploy**.',
              '',
              `PR commit: [\`${sha.slice(0, 12)}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}).`,
              'This approves the hardware test job. CI has already built the firmware. The link also shows test progress and results.',
            ].join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

      - name: Download CI source revision
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v4
        with:
          name: ci-source-revision
          path: ${{ runner.temp }}/ci-source-revision
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read CI source revision
        if: steps.pr.outputs.number != ''
        id: source
        run: |
          sha=$(cat "$RUNNER_TEMP/ci-source-revision/ci-source-sha.txt")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid CI source revision" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  test:
    needs: find-pr
    if: needs.find-pr.outputs.number != ''
    uses: ./.github/workflows/test.yml
    with:
      pr-number: ${{ fromJSON(needs.find-pr.outputs.number) }}
      checkout-ref: ${{ needs.find-pr.outputs.checkout-ref }}

  report-status:
    needs: [find-pr, test]
    if: always() && needs.find-pr.outputs.number != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Report hardware test result in PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          # A rerun may already have replaced this run's pending status.
          latest_url=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
            --jq '.statuses[] | select(.context == "Hardware Test (fork PRs)") | .target_url')
          if [ "$latest_url" != "$run_url" ]; then
            exit 0
          fi
          case "$TEST_RESULT" in
            success) state=success; description='Hardware test job completed' ;;
            failure) state=failure; description='Hardware test job failed - open Details' ;;
            *) state=error; description="Hardware test job $TEST_RESULT - open Details" ;;
          esac
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context='Hardware Test (fork PRs)' \
            -f description="$description" \
            -f target_url="$run_url" > /dev/null
