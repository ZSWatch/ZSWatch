name: Test Only without flashing

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'CI run ID to take the native_sim image from (from the run URL)'
        required: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      run-id: ${{ inputs.run-id }}
      skip-flash: true
