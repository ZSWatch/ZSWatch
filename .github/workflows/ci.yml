name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  pull-requests: write
  checks: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  membrowse-comment:
    needs: [build]
    # Internal PRs only: fork PRs have no secrets here and are handled by
    # membrowse-comment.yml via workflow_run. Run even if some builds failed.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Post combined PR comment
        if: ${{ env.MEMBROWSE_API_KEY != '' }}
        uses: membrowse/membrowse-action/comment-action@v1
        with:
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          api_url: ${{ vars.MEMBROWSE_API_URL }}
          commit: ${{ github.event.pull_request.head.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: [build]
    # Fork PRs get no self-hosted runners here, test-fork.yml tests them after this run.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test.yml
