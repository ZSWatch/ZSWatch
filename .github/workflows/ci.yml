name: CI

on:
  # Trusted workflows build every PR head, including first-time fork contributors.
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    # Fork code runs only on GitHub-hosted runners, with read-only permissions.
    uses: ./.github/workflows/build.yml

  test:
    needs: [build]
    # A skipped/failed build prevents tests. Forks wait for approval in test.yml.
    # Keep manual dispatch build-only, as before.
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
      pull-requests: write
      checks: write
    uses: ./.github/workflows/test.yml
