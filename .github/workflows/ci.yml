name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  pull-requests: write
  checks: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    needs: [build]
    # Fork PRs get no self-hosted runners here, test-fork.yml tests them after this run.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test.yml
