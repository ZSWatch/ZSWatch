[pytest]
log_cli = True
log_cli_level = INFO
minversion = 6.0
addopts = -ra -q
asyncio_mode = auto
markers =
    companion_session: audited test that preserves the phone BLE session (no reset, deployment, power switching or PC BLE)
    linux_only: mark test as only for native_sim/linux device
    ppk2: mark test as requiring PPK2 hardware
