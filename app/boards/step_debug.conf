# Step IRQ and floor/profile event diagnostics. Add after debug.conf in EXTRA_CONF_FILE.
CONFIG_LOG_MAX_LEVEL=4
# Step debug configuration, 
# Set to 'y' to enable step debug, 'n' to disable it
# Default is 'n'
CONFIG_ZSW_BMI270_STEP_DEBUG=n
CONFIG_ZSW_BOSCH_BMI270_LOG_LEVEL_WRN=y 
# Uncomment the following line to enable debug logging for the BMI270 sensor
# CONFIG_ZSW_BOSCH_BMI270_LOG_LEVEL_DBG=y 


# General sensors and application log levels
CONFIG_ZSW_SENSORS_LOG_LEVEL_INF=y
CONFIG_ZSW_APP_LOG_LEVEL_INF=y
