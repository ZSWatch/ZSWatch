# Heart rate addon PCB for ZSWatch rev 1. Use together with
# zswatch_nrf5340_cpuapp_hr.overlay:
#   west build app -b zswatch@1/nrf5340/cpuapp -- \
#     -DEXTRA_CONF_FILE=boards/zswatch/zswatch/zswatch_nrf5340_cpuapp_hr.conf \
#     -DEXTRA_DTC_OVERLAY_FILE=boards/zswatch/zswatch/zswatch_nrf5340_cpuapp_hr.overlay

CONFIG_SENSOR_MAX32664C=y
CONFIG_MAX32664C_USE_EXTENDED_REPORTS=y
CONFIG_MAX32664C_USE_STATIC_MEMORY=y
CONFIG_MAX32664C_THREAD_STACK_SIZE=2048
