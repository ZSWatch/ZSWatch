# Logs LVGL FPS and render/flush times about every 300 ms while the UI is redrawn.
# Use together with a log transport fragment, look for "lvgl: ... FPS" in the log.
CONFIG_LV_USE_SYSMON=y
CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_LV_USE_PERF_MONITOR_LOG_MODE=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_USER=y
